# 默认开发入口 = 公共安全基线（docker-compose.base.yml）+ 本地调试端口
# 开发：docker compose up -d          （本文件，暴露 3306/9090/3000 便于本机调试）
# 生产：docker compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?未设置 DB_PASSWORD，请先 cp .env.docker.example .env 并填写}
      MYSQL_DATABASE: ${DB_NAME:-my_project}
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?未设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-my_project}
      JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET，禁止使用弱默认密钥}
      SIGN_SECRET: ${SIGN_SECRET:?未设置 SIGN_SECRET，签章密钥须独立于 JWT 密钥}
    ports:
      - '3011:3011'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3011/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - uploads_data:/app/server/uploads
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?未设置 GRAFANA_ADMIN_PASSWORD，禁止使用弱默认密码}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3000:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
  prometheus_data:
  grafana_data:
