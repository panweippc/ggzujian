# Prometheus 抓取配置
# 抓 starter 后端暴露的 /metrics（见 server/routes/gateway-ext.js）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'starter-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3011']
        labels:
          service: 'starter'
